# QX Chain Multi-Node Test Network
# This configuration spawns a 4-node local network with AURA + GRANDPA consensus
# All nodes are validators using pre-configured test keys (Alice, Bob, Charlie, Dave)

[settings]
timeout = 1000
provider = "native"
enable_tracing = false
node_spawn_timeout = 300

[relaychain]
chain = "local_testnet_chain_spec_raw.json"
default_command = "./target/release/qxchain"

# Node 1: Alice (Primary validator)
[[relaychain.nodes]]
name = "alice"
validator = true
rpc_port = 9944
port = 30333

# Node 2: Bob
[[relaychain.nodes]]
name = "bob"
validator = true
rpc_port = 9945
port = 30334

# Node 3: Charlie
[[relaychain.nodes]]
name = "charlie"
validator = true
rpc_port = 9946
port = 30335

# Node 4: Dave
[[relaychain.nodes]]
name = "dave"
validator = true
rpc_port = 9947
port = 30336
