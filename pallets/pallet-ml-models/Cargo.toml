[package]
name = "pallet-ml-models"
version = "0.1.0"
description = "Machine Learning model registry and management pallet"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

[features]
default = ["std"]
std = ["codec/std", "polkadot-sdk/std", "scale-info/std"]
runtime-benchmarks = ["polkadot-sdk/runtime-benchmarks"]
try-runtime = ["polkadot-sdk/try-runtime"]