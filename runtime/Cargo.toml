[package]
name = "qxchain-runtime"
description = "QX Chain runtime for decentralized AI inference validation with opML consensus."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[dependencies]
codec = { workspace = true }
pallet-qx-ai = { path = "../pallets/pallet-qx-ai", default-features = false }
polkadot-sdk = { workspace = true, features = ["pallet-balances", "pallet-sudo", "pallet-timestamp", "pallet-transaction-payment", "pallet-transaction-payment-rpc-runtime-api", "runtime"] }
scale-info = { workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

[build-dependencies]
polkadot-sdk = { optional = true, workspace = true, features = ["substrate-wasm-builder"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"pallet-qx-ai/std",
	"polkadot-sdk/std",
	"scale-info/std",
	"serde_json/std",
]
